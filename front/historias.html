<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias de Usuario - Gestor de Historias de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Historias de Usuario</h1>
    </header>

    <div class="container">
        <nav>
            <a href="index.html">Inicio</a>
            <a href="sprints.html">Sprints</a>
            <a href="informes.html">Informes</a>
        </nav>

        <section>
            <h2>Lista de Historias</h2>

            <div style="margin-bottom: 15px;">
                <label for="filtroSprint">Filtrar por sprint:</label>
                <select id="filtroSprint">
                    <option value="">Todos los sprints</option>
                </select>
            </div>

            <table id="historiasTb">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Título</th>
                        <th>Responsable</th>
                        <th>Estado</th>
                        <th>Puntos</th>
                        <th>Sprint</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7">No hay historias...</td></tr>
                </tbody>
            </table>

            <button id="nuevaHistoriaBtn">Nueva Historia</button>

            <form name="historiaForm" style="display:none;" id="historiaForm">
                <h3>Registrar Historia de Usuario</h3>
                <div>
                    <label for="titulo">Título:</label>
                    <input type="text" name="titulo" id="titulo" required>
                </div>
                <div>
                    <label for="descripcion">Descripción:</label>
                    <textarea name="descripcion" id="descripcion" rows="3" required></textarea>
                </div>
                <div>
                    <label for="responsable">Responsable:</label>
                    <input type="text" name="responsable" id="responsable" required>
                </div>
                <div>
                    <label for="estado">Estado:</label>
                    <select name="estado" id="estado">
                        <option value="nueva">Nueva</option>
                        <option value="activa">Activa</option>
                        <option value="finalizada">Finalizada</option>
                        <option value="impedimento">Impedimento</option>
                    </select>
                </div>
                <div>
                    <label for="puntos">Puntos:</label>
                    <input type="number" name="puntos" id="puntos" min="1" required>
                </div>
                <div>
                    <label for="fecha_creacion">Fecha Creación:</label>
                    <input type="date" name="fecha_creacion" id="fecha_creacion" required>
                </div>
                <div>
                    <label for="fecha_finalizacion">Fecha Finalización:</label>
                    <input type="date" name="fecha_finalizacion" id="fecha_finalizacion">
                </div>
                <div>
                    <label for="sprint_id">Sprint:</label>
                    <select name="sprint_id" id="sprint_id" required>
                        <option value="">Seleccionar sprint</option>
                    </select>
                </div>
                <div>
                    <button type="reset" class="secondary">Cancelar</button>
                    <button type="submit">Guardar</button>
                </div>
            </form>

            <div id="msg" class="msg"></div>
        </section>
    </div>

    <script src="js/historias.js"></script>
</body>
</html>
